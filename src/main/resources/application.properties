spring.application.name=sistema-gestion-torneos

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/torneos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}

# Secreto JWT: NUNCA lo escribas en el código ni lo subas a GitHub.
# Genéralo con:  openssl rand -base64 64
# y expórtalo como variable de entorno:  export JWT_SECRET="..."
app.jwt.secret=${JWT_SECRET}
 
# Vida corta del token (15 minutos)
app.jwt.expiration-ms=900000
 
# No exponer detalles internos en errores
server.error.include-message=always
server.error.include-stacktrace=never
