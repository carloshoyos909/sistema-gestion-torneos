services:
  postgres:
    image: postgres:16
    container_name: torneos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: torneos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - torneos_postgres_data:/var/lib/postgresql/data

volumes:
  torneos_postgres_data:
